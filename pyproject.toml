[project]
name = "jev-bookmarks"
version = "0.2.0"
description = "Chrome履歴から役立つページを選び、Jevで操作してプロジェクトごとに記録する"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.28,<1",
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git",
]

[project.scripts]
jev-bookmarks = "jev_bookmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
