[project]
name = "jev-bookmarks"
version = "0.3.6"
description = "Chrome履歴から役立つページを選び、Jevで操作してプロジェクトごとに記録する"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.32.7,<4",
  "httpx[http2]>=0.28,<1",
  # 上流 browser-use/jev-ultrafast に私たちの修正（UTF-8での読み込みなど）が入るまで、フォークの確認済みの版を使う。
  "jev-ultrafast @ git+https://github.com/quolu/jev-ultrafast.git@1606fc7319352a08f4d8752eedad87b860d95250",
  "websockets>=15,<16",
]

[project.scripts]
jev-bookmarks = "jev_bookmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
